<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>머니냥 테마 시안 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#181c26;font-family:'Noto Sans KR',sans-serif;color:#f0f2f8;padding:24px;}
  h1{font-size:20px;margin:0 0 4px;}
  p{margin:0 0 20px;color:#9aa4c0;font-size:14px;}
  .row{display:flex;gap:20px;overflow-x:auto;padding-bottom:16px;}
  .cell{flex:none;display:flex;flex-direction:column;gap:10px;}
  .cell h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;font-weight:700;}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25);}
  iframe{width:390px;height:720px;border:none;border-radius:24px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.45);}
</style>
</head>
<body>
<h1>🎨 머니냥 테마 시안 5종 — 나란히 미리보기</h1>
<p>각 화면은 실제 앱입니다 (조작 가능). 마음에 드는 테마는 앱 안 🎨 버튼으로 적용하세요.</p>
<div class="row">
  <div class="cell"><h2><span class="dot" style="background:#fdf8f0"></span>파스텔 (현재)</h2><iframe src="index.html?themePreview=pastel"></iframe></div>
  <div class="cell"><h2><span class="dot" style="background:#dfe8f6"></span>스카이</h2><iframe src="index.html?themePreview=sky"></iframe></div>
  <div class="cell"><h2><span class="dot" style="background:#daeee2"></span>민트</h2><iframe src="index.html?themePreview=mint"></iframe></div>
  <div class="cell"><h2><span class="dot" style="background:#e6def3"></span>라벤더</h2><iframe src="index.html?themePreview=lavender"></iframe></div>
  <div class="cell"><h2><span class="dot" style="background:#f2ded0"></span>피치</h2><iframe src="index.html?themePreview=peach"></iframe></div>
</div>
</body>
</html>
